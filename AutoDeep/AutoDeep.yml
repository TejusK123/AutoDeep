# Portable environment for linux-64 and osx-arm64.
# Exact pins on packages that affect results; the exact Linux environment
# the shipped model was trained in is AutoDeep.linux-64.lock.yml.
name: AutoDeep
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - numpy=1.23.5
  - scipy=1.13.1
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - xgboost=2.1.1
  - viennarna=2.7.0
  - ray-tune=2.37.0
  - ray-default=2.37.0
  - optuna=4.1.0
  - pdf2image=1.17.0
  - poppler
  - pillow
  - click
  - tqdm
  - joblib
  - matplotlib
  - graphviz
  - python-graphviz
  - pyyaml
  - pytest
